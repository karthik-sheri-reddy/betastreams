# Station call-sign table (§4, cascade step 3). Maps a US broadcast
# call sign to its network affiliation and city. This is a tiny starting
# set — the big-4 affiliates in the three largest US TV markets — real
# publicly-known call signs, not fabricated, but nowhere near a full FCC
# database. §5 (Stage B) is where the full station -> DMA table and
# 506sports integration land; this file only needs enough for Stage A's
# cascade to have something real to test against.
#
# TODO(operator): replace/extend with a full station list, ideally
# sourced from RabbitEars.info or FCC data per §5, before relying on this
# for anything beyond the three markets below.
version: 1
